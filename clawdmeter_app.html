<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clawdmeter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .device {
    width: 420px;
    height: 230px;
    background: #000;
    border: 3px solid #222;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 0 40px rgba(0, 221, 255, 0.12);
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    border-bottom: 2px solid #ff9900;
  }

  .header h1 {
    color: #00ddff;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #666;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00cc44;
  }
  .status-dot.error { background: #ff3333; }

  .content {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    gap: 10px;
  }

  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .col-divider {
    width: 1px;
    background: #333;
    margin: 0 2px;
  }

  .section-label {
    color: #ff9900;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .section-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pct-value {
    font-size: 28px;
    font-weight: bold;
    min-width: 52px;
    line-height: 1;
  }

  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bar-container {
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .bar-info {
    font-size: 13px;
    color: #aaa;
    text-align: right;
    font-weight: bold;
  }

  .col-extra {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .extra-amount {
    display: flex;
    align-items: baseline;
    gap: 6px;
    justify-content: center;
  }

  .extra-used {
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
  }

  .extra-limit {
    color: #666;
    font-size: 12px;
  }

  .extra-bar {
    position: relative;
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
    width: 100%;
  }

  .extra-bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .extra-bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 3px #000;
  }

  .footer {
    background: #1a1a1a;
    border-top: 1px solid #ff9900;
    padding: 3px 10px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #555;
  }

  .loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00ddff;
    font-size: 14px;
  }

  .color-green { color: #00cc44; }
  .color-yellow { color: #ffcc00; }
  .color-red { color: #ff3333; }
  .bg-green { background: #00cc44; }
  .bg-yellow { background: #ffcc00; }
  .bg-red { background: #ff3333; }
</style>
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="header">
      <h1>CLAWDMETER</h1>
      <div class="header-right">
        <span id="statusText">--</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </div>
    <div class="loading" id="loading">Conectando...</div>
    <div class="content" id="content" style="display:none"></div>
    <div class="footer">
      <span id="plan">--</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>
</div>

<script>
const PROXY = 'http://localhost:3456/api/usage';
const REFRESH = 60000;

function pctColor(p) { return p < 50 ? 'green' : p < 80 ? 'yellow' : 'red'; }

function fmtReset(iso) {
  if (!iso) return '—';
  try {
    let d = (new Date(iso) - new Date()) / 1000;
    if (d <= 0) return 'Reset!';
    let h = Math.floor(d/3600), m = Math.floor((d%3600)/60);
    return h > 0 ? h+'h '+m+'m' : m+'m';
  } catch { return '?'; }
}

function renderRate(label, s) {
  let p = s?.utilization || 0, c = pctColor(p), r = fmtReset(s?.resets_at);
  return `
    <div class="section-label">${label}</div>
    <div class="section-row">
      <span class="pct-value color-${c}">${p.toFixed(0)}%</span>
      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar-fill bg-${c}" style="width:${Math.min(p,100)}%"></div>
        </div>
        <div class="bar-info">reset: ${r}</div>
      </div>
    </div>`;
}

function renderExtra(e) {
  if (!e?.is_enabled) return '';
  let p=e.utilization||0, u=(e.used_credits||0)/100, l=(e.monthly_limit||0)/100, c=pctColor(p);
  return `
    <div class="section-label">EXTRA USAGE</div>
    <div class="extra-amount">
      <span class="extra-used color-${c}">$${u.toFixed(2)}</span>
      <span class="extra-limit">/ $${l.toFixed(0)}</span>
    </div>
    <div class="extra-bar">
      <div class="extra-bar-fill bg-${c}" style="width:${Math.min(p,100)}%"></div>
      <div class="extra-bar-label">${p.toFixed(1)}%</div>
    </div>`;
}

async function refresh() {
  try {
    const r = await fetch(PROXY);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(), u = d.usage;

    let left = renderRate('5 HORAS', u.five_hour) + renderRate('7 DIAS', u.seven_day);
    let right = renderExtra(u.extra_usage);

    document.getElementById('content').innerHTML = `
      <div class="col">${left}</div>
      <div class="col-divider"></div>
      <div class="col-extra">${right}</div>`;
    document.getElementById('content').style.display = 'flex';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Live';

    let plan = (d.org?.plan||'').replace('default_','').replace(/_/g,' ');
    document.getElementById('plan').textContent = plan;
  } catch(e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Error';
  }
}

refresh();
setInterval(refresh, REFRESH);
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);
</script>
</body>
</html>
