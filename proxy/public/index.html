<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Clawdmeter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 18px;
    min-height: 100vh;
    padding: 24px 12px;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    flex: 0 0 auto;
    width: 420px;
    height: 230px;
    background: #000;
    border: 3px solid #222;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 0 40px var(--glow, rgba(0, 221, 255, 0.12));
    transition: box-shadow 1s ease;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    border-bottom: 2px solid #ff9900;
  }

  .header h1 {
    color: #00ddff;
    font-size: 13px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mascot {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    animation: mascot-pulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 3px rgba(217,119,87,0.5));
  }

  @keyframes mascot-pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #666;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00cc44;
  }
  .status-dot.error { background: #ff3333; }

  .content {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    gap: 10px;
  }

  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .col-divider {
    width: 1px;
    background: #333;
    margin: 0 2px;
  }

  .section-label {
    color: #ff9900;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .section-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pct-value {
    font-size: 28px;
    font-weight: bold;
    min-width: 52px;
    line-height: 1;
  }

  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bar-container {
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .bar-info {
    font-size: 13px;
    color: #aaa;
    text-align: right;
    font-weight: bold;
  }

  .col-extra {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .extra-amount {
    display: flex;
    align-items: baseline;
    gap: 6px;
    justify-content: center;
  }

  .extra-used {
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
  }

  .extra-limit {
    color: #666;
    font-size: 12px;
  }

  .extra-bar {
    position: relative;
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
    width: 100%;
  }

  .extra-bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .extra-bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 3px #000;
  }

  .footer {
    background: #1a1a1a;
    border-top: 1px solid #ff9900;
    padding: 3px 10px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #00ddff;
  }

  .loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00ddff;
    font-size: 14px;
  }

  /* --- Historico (vista que puede crecer) --- */
  .history {
    flex: 1 1 480px;
    max-width: 800px;
    background: #000;
    border: 3px solid #222;
    border-radius: 14px;
    padding: 12px 14px;
  }
  .hist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .hist-title { color: #ff9900; font-size: 12px; letter-spacing: 2px; font-weight: bold; }
  .hist-windows { display: flex; gap: 4px; }
  .hist-windows button {
    background: #1a1a1a; color: #888; border: 1px solid #333; border-radius: 4px;
    font: inherit; font-size: 11px; padding: 3px 9px; cursor: pointer;
  }
  .hist-windows button.active { color: #00ddff; border-color: #00ddff; }
  #chart { width: 100%; height: auto; display: block; }
  .hist-legend {
    display: flex; gap: 14px; justify-content: center;
    margin: 6px 0 10px; font-size: 10px; color: #aaa;
  }
  .hist-legend i {
    display: inline-block; width: 10px; height: 3px;
    vertical-align: middle; margin-right: 4px; border-radius: 2px;
  }
  .hist-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .hcard { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 7px 9px; }
  .hcard .lbl { font-size: 9px; color: #888; letter-spacing: 1px; }
  .hcard .val { font-size: 15px; font-weight: bold; color: #e0e0e0; margin-top: 2px; }

  /* Pantalla angosta: layout en columna (display arriba, historico abajo) */
  @media (max-width: 900px) {
    body { flex-direction: column; align-items: center; }
    /* En columna no estiramos: mismo ancho que el device (420), centrado */
    .history { flex: 0 0 auto; width: 100%; max-width: 420px; }
  }

  /* Banner de estado del proxy (Brave caido / sin sesion / datos viejos) */
  .banner {
    width: 100%;
    order: -1;            /* siempre arriba de todo, ocupa su propia fila */
    max-width: 1238px;
    box-sizing: border-box;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .banner.err { background: #350c0c; color: #ff6b6b; border: 1px solid #ff3333; }
  .banner.warn { background: #352c0c; color: #ffcc55; border: 1px solid #cc9900; }
</style>
</head>
<body>

<div class="banner" id="banner" style="display:none"></div>

<div class="device">
  <div class="screen">
    <div class="header">
      <h1><svg class="mascot" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" fill-rule="evenodd"/></svg> CLAWDMETER</h1>
      <div class="header-right">
        <span id="statusText">--</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </div>
    <div class="loading" id="loading">Conectando...</div>
    <div class="content" id="content" style="display:none"></div>
    <div class="footer">
      <span id="plan">--</span>
      <span id="lastUpdate">Upd --:--:--</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>
</div>

<div class="history" id="history">
  <div class="hist-head">
    <span class="hist-title">HISTORICO</span>
    <div class="hist-windows">
      <button data-w="5h">5H</button>
      <button data-w="24h" class="active">24H</button>
      <button data-w="7d">7D</button>
    </div>
  </div>
  <canvas id="chart" width="780" height="220"></canvas>
  <div class="hist-legend">
    <span><i style="background:#00ddff"></i>5 horas</span>
    <span><i style="background:#ff9900"></i>7 dias</span>
    <span><i style="background:#c071ff"></i>extra</span>
  </div>
  <div class="hist-cards" id="histCards"></div>
</div>

<script>
const PROXY = '/api/usage';
const REFRESH = 60000;
let lastSuccessAt = 0;

function smoothColor(p) {
  let r, g;
  if (p < 50) {
    r = Math.round((p / 50) * 255);
    g = 204;
  } else {
    r = 255;
    g = Math.round(204 * (1 - (p - 50) / 50));
  }
  return `rgb(${r},${g},0)`;
}

function fmtReset(iso) {
  if (!iso) return '--';
  try {
    let d = (new Date(iso) - new Date()) / 1000;
    if (d <= 0) return 'Reset!';
    let h = Math.floor(d/3600), m = Math.floor((d%3600)/60);
    return h > 0 ? h+'h '+m+'m' : m+'m';
  } catch { return '?'; }
}

function renderRate(label, s) {
  let p = s?.utilization || 0, sc = smoothColor(p), r = fmtReset(s?.resets_at);
  return `
    <div class="section-label">${label}</div>
    <div class="section-row">
      <span class="pct-value" style="color:${sc}">${p.toFixed(0)}%</span>
      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar-fill" style="width:${Math.min(p,100)}%;background:${sc}"></div>
        </div>
        <div class="bar-info">reset: ${r}</div>
      </div>
    </div>`;
}

function renderExtra(e) {
  if (!e?.is_enabled) return '';
  let p=e.utilization||0, u=(e.used_credits||0)/100, l=(e.monthly_limit||0)/100, sc=smoothColor(p);
  return `
    <div class="section-label">EXTRA USAGE</div>
    <div class="extra-amount">
      <span class="extra-used" style="color:${sc}">$${u.toFixed(2)}</span>
      <span class="extra-limit">/ $${l.toFixed(0)}</span>
    </div>
    <div class="extra-bar">
      <div class="extra-bar-fill" style="width:${Math.min(p,100)}%;background:${sc}"></div>
      <div class="extra-bar-label">${p.toFixed(1)}%</div>
    </div>`;
}

function setBanner(msg, kind) {
  const b = document.getElementById('banner');
  if (!msg) { b.style.display = 'none'; return; }
  b.textContent = msg;
  b.className = 'banner ' + (kind || '');
  b.style.display = 'block';
}

// Traduce el estado del proxy a un banner (o lo oculta si todo va bien).
function applyProxyState(p, stale) {
  p = p || {};
  if (p.connected === false) return setBanner('⚠ Brave caido — el proxy intenta reconectar', 'err');
  if (p.sessionValid === false) return setBanner('⚠ Sin sesion en claude.ai — ejecuta ./start.sh --login', 'err');
  if (stale) return setBanner('⚠ Datos desactualizados — el proxy no pudo refrescar', 'warn');
  setBanner(null);
}

async function refresh() {
  try {
    const r = await fetch(PROXY);
    if (!r.ok) {
      let info = {};
      try { info = await r.json(); } catch {}
      applyProxyState(info.proxy, true);
      throw new Error(r.status);
    }
    const d = await r.json(), u = d.usage;

    let left = renderRate('5 HORAS', u.five_hour) + renderRate('7 DIAS', u.seven_day);
    let right = renderExtra(u.extra_usage);

    document.getElementById('content').innerHTML = `
      <div class="col">${left}</div>
      <div class="col-divider"></div>
      <div class="col-extra">${right}</div>`;
    document.getElementById('content').style.display = 'flex';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Live';

    let raw = d.org?.plan || '';
    let plan = raw.replace(/^default_/,'').replace(/^claude_/,'').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById('plan').textContent = plan;
    lastSuccessAt = Date.now();
    document.getElementById('lastUpdate').textContent = 'Upd ' + new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('lastUpdate').style.color = '#00ddff';

    let p5 = u.five_hour?.utilization || 0;
    let gc = smoothColor(p5);
    let m = gc.match(/\d+/g);
    document.querySelector('.device').style.setProperty('--glow', `rgba(${m[0]},${m[1]},${m[2]},0.25)`);

    applyProxyState(d.proxy, d.stale);
  } catch(e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Error';
    // Si el error no es HTTP (e.message no es un numero), el proxy no responde.
    if (isNaN(+e.message)) setBanner('⚠ Proxy no responde', 'err');
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

refresh();
setInterval(refresh, REFRESH);
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (lastSuccessAt > 0) {
    let stale = (Date.now() - lastSuccessAt) / REFRESH;
    let el = document.getElementById('lastUpdate');
    if (stale > 3) el.style.color = '#ff3333';
    else if (stale > 2) el.style.color = '#ffcc00';
  }
}, 1000);

// ---- HISTORICO ----
const HCOLORS = { five_hour: '#00ddff', seven_day: '#ff9900', extra_usage: '#c071ff' };
let histWindow = '24h';

function fmtEta(min) {
  if (min == null || min < 0) return '-';
  if (min < 60) return min + 'm';
  if (min < 1440) return Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60);
  return d + 'd ' + h + 'h';
}
function trendArrow(t) { return t === 'up' ? '▲' : t === 'down' ? '▼' : '▬'; }

// Proyeccion: la ETA al limite (al ritmo actual) es el dato principal. El color
// dice si llegas a tocarlo (rojo) o si la ventana resetea antes => tranqui (verde).
function projInfo(m) {
  const a = trendArrow(m.trend);
  if (m.etaMin > 0) {
    return { text: a + ' lim ' + fmtEta(m.etaMin), color: m.hitsLimit ? '#ff6b6b' : '#00cc66' };
  }
  return { text: a + ' OK', color: '#5ad17f' };
}

function drawChart(series) {
  const c = document.getElementById('chart'), ctx = c.getContext('2d');
  const W = c.width, H = c.height, padL = 44, padR = 8, padT = 12, padB = 20;
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.fillStyle = '#e6edf3'; ctx.font = 'bold 15px monospace'; ctx.textBaseline = 'middle';
  for (let p = 0; p <= 100; p += 25) {
    const y = padT + (1 - p / 100) * (H - padT - padB);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(p + '%', 4, y);
  }

  let tmin = Infinity, tmax = -Infinity;
  for (const k in series) for (const pt of series[k]) { if (pt.t < tmin) tmin = pt.t; if (pt.t > tmax) tmax = pt.t; }
  if (!isFinite(tmin)) {
    ctx.fillStyle = '#a8b4c0';
    ctx.fillText('Sin datos aun - el historico se llena con el tiempo', padL + 10, H / 2);
    return;
  }
  const span = Math.max(1, tmax - tmin);
  const X = t => padL + ((t - tmin) / span) * (W - padL - padR);
  const Y = v => padT + (1 - v / 100) * (H - padT - padB);
  for (const k in series) {
    const pts = series[k]; if (!pts.length) continue;
    ctx.strokeStyle = HCOLORS[k]; ctx.lineWidth = 2; ctx.beginPath();
    pts.forEach((pt, i) => { const x = X(pt.t), y = Y(pt.v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
}

function fillCards(sum, warn) {
  const m = sum.five_hour || {};
  const w = sum.seven_day || {};
  const p5 = projInfo(m), pw = projInfo(w);
  const cards = [
    ['PICO 5H', m.peak == null ? '-' : m.peak + '%', null],
    ['PROMEDIO 5H', m.avg == null ? '-' : m.avg + '%', null],
    ['EN ROJO ≥' + (warn || 80) + '%', Math.round((m.redZoneFrac || 0) * 100) + '%', null],
    ['PROY. 5H', p5.text, p5.color],
    ['PROY. SEMANA', pw.text, pw.color],
  ];
  document.getElementById('histCards').innerHTML = cards.map(([l, v, c]) =>
    `<div class="hcard"><div class="lbl">${l}</div><div class="val"${c ? ` style="color:${c}"` : ''}>${v}</div></div>`).join('');
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history?window=' + histWindow + '&points=120');
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    drawChart(d.series);
    fillCards(d.summary, d.warn);
  } catch (e) { /* el proxy puede no tener historico todavia */ }
}

document.querySelectorAll('.hist-windows button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.hist-windows button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    histWindow = b.dataset.w;
    loadHistory();
  });
});
loadHistory();
setInterval(loadHistory, REFRESH);
</script>
</body>
</html>
