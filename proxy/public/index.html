<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Clawdmeter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    width: 420px;
    height: 230px;
    background: #000;
    border: 3px solid #222;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 0 40px var(--glow, rgba(0, 221, 255, 0.12));
    transition: box-shadow 1s ease;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    border-bottom: 2px solid #ff9900;
  }

  .header h1 {
    color: #00ddff;
    font-size: 13px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mascot {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    animation: mascot-pulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 3px rgba(217,119,87,0.5));
  }

  @keyframes mascot-pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #666;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00cc44;
  }
  .status-dot.error { background: #ff3333; }

  .content {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    gap: 10px;
  }

  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .col-divider {
    width: 1px;
    background: #333;
    margin: 0 2px;
  }

  .section-label {
    color: #ff9900;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .section-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pct-value {
    font-size: 28px;
    font-weight: bold;
    min-width: 52px;
    line-height: 1;
  }

  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bar-container {
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .bar-info {
    font-size: 13px;
    color: #aaa;
    text-align: right;
    font-weight: bold;
  }

  .col-extra {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .extra-amount {
    display: flex;
    align-items: baseline;
    gap: 6px;
    justify-content: center;
  }

  .extra-used {
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
  }

  .extra-limit {
    color: #666;
    font-size: 12px;
  }

  .extra-bar {
    position: relative;
    height: 14px;
    border: 1px solid #444;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
    width: 100%;
  }

  .extra-bar-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 1px;
  }

  .extra-bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 3px #000;
  }

  .footer {
    background: #1a1a1a;
    border-top: 1px solid #ff9900;
    padding: 3px 10px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #00ddff;
  }

  .loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00ddff;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="header">
      <h1><svg class="mascot" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" fill-rule="evenodd"/></svg> CLAWDMETER</h1>
      <div class="header-right">
        <span id="statusText">--</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </div>
    <div class="loading" id="loading">Conectando...</div>
    <div class="content" id="content" style="display:none"></div>
    <div class="footer">
      <span id="plan">--</span>
      <span id="lastUpdate">Upd --:--:--</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>
</div>

<script>
const PROXY = '/api/usage';
const REFRESH = 60000;
let lastSuccessAt = 0;

function smoothColor(p) {
  let r, g;
  if (p < 50) {
    r = Math.round((p / 50) * 255);
    g = 204;
  } else {
    r = 255;
    g = Math.round(204 * (1 - (p - 50) / 50));
  }
  return `rgb(${r},${g},0)`;
}

function fmtReset(iso) {
  if (!iso) return '--';
  try {
    let d = (new Date(iso) - new Date()) / 1000;
    if (d <= 0) return 'Reset!';
    let h = Math.floor(d/3600), m = Math.floor((d%3600)/60);
    return h > 0 ? h+'h '+m+'m' : m+'m';
  } catch { return '?'; }
}

function renderRate(label, s) {
  let p = s?.utilization || 0, sc = smoothColor(p), r = fmtReset(s?.resets_at);
  return `
    <div class="section-label">${label}</div>
    <div class="section-row">
      <span class="pct-value" style="color:${sc}">${p.toFixed(0)}%</span>
      <div class="bar-wrapper">
        <div class="bar-container">
          <div class="bar-fill" style="width:${Math.min(p,100)}%;background:${sc}"></div>
        </div>
        <div class="bar-info">reset: ${r}</div>
      </div>
    </div>`;
}

function renderExtra(e) {
  if (!e?.is_enabled) return '';
  let p=e.utilization||0, u=(e.used_credits||0)/100, l=(e.monthly_limit||0)/100, sc=smoothColor(p);
  return `
    <div class="section-label">EXTRA USAGE</div>
    <div class="extra-amount">
      <span class="extra-used" style="color:${sc}">$${u.toFixed(2)}</span>
      <span class="extra-limit">/ $${l.toFixed(0)}</span>
    </div>
    <div class="extra-bar">
      <div class="extra-bar-fill" style="width:${Math.min(p,100)}%;background:${sc}"></div>
      <div class="extra-bar-label">${p.toFixed(1)}%</div>
    </div>`;
}

async function refresh() {
  try {
    const r = await fetch(PROXY);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(), u = d.usage;

    let left = renderRate('5 HORAS', u.five_hour) + renderRate('7 DIAS', u.seven_day);
    let right = renderExtra(u.extra_usage);

    document.getElementById('content').innerHTML = `
      <div class="col">${left}</div>
      <div class="col-divider"></div>
      <div class="col-extra">${right}</div>`;
    document.getElementById('content').style.display = 'flex';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Live';

    let raw = d.org?.plan || '';
    let plan = raw.replace(/^default_/,'').replace(/^claude_/,'').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById('plan').textContent = plan;
    lastSuccessAt = Date.now();
    document.getElementById('lastUpdate').textContent = 'Upd ' + new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('lastUpdate').style.color = '#00ddff';

    let p5 = u.five_hour?.utilization || 0;
    let gc = smoothColor(p5);
    let m = gc.match(/\d+/g);
    document.querySelector('.device').style.setProperty('--glow', `rgba(${m[0]},${m[1]},${m[2]},0.25)`);
  } catch(e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Error';
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

refresh();
setInterval(refresh, REFRESH);
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (lastSuccessAt > 0) {
    let stale = (Date.now() - lastSuccessAt) / REFRESH;
    let el = document.getElementById('lastUpdate');
    if (stale > 3) el.style.color = '#ff3333';
    else if (stale > 2) el.style.color = '#ffcc00';
  }
}, 1000);
</script>
</body>
</html>
